<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập - Portfolio</title>

    <link rel="stylesheet" href="css/login.css">

</head>


<body>

    <main class="login-page">

        <div class="login-container">

            <!-- Logo / Tiêu đề -->
            <div class="login-header">

                <div class="login-logo">
                    KHANG.
                </div>

                <h1>
                    Đăng nhập
                </h1>

                <p>
                    Đăng nhập vào khu vực quản trị
                </p>

            </div>


            <!-- Form đăng nhập -->
            <form class="login-form" action="admin.html">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Nhập email của bạn"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>
                            Ghi nhớ đăng nhập
                        </span>

                    </label>

                    <a href="#">
                        Quên mật khẩu?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Đăng nhập
                </button>

            </form>


            <!-- Quay lại trang chủ -->
            <div class="back-home">

                <a href="index.html">
                    ← Quay về trang chủ
                </a>

            </div>

        </div>

    </main>

</body>

</html>
